name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noelons
          POSTGRES_PASSWORD: noelons
          POSTGRES_DB: noelons_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noelons"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://noelons:noelons@localhost:5432/noelons_test
      DATABASE_URL: postgres://noelons:noelons@localhost:5432/noelons_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Fresh migrate + seed (exercises the whole service layer)
        run: npm run db:reset
      - name: Production build
        run: npm run build
